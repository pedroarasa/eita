<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória - Poderes</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #ccc; /* fundo cinza */
    color: #111;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 {
    margin-bottom: 10px;
}

#game {
    width: 90%;
    max-width: 600px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.card {
    width: 100%;
    padding-bottom: 100%;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s;
    border-radius: 8px;
}

.card.flip {
    transform: rotateY(180deg);
}

.face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 8px;
}

.front {
    transform: rotateY(180deg);
    background-size: cover;
    background-position: center;
}

.back {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    background: #888; /* cinza para contrapor suas imagens pretas */
    color: #fff;
}
.card.match .front {
    filter: brightness(1.3);
}
</style>
</head>
<body>

<h1>Jogo da Memória – Poderes</h1>
<p>Encontre todos os pares!</p>

<div id="game"></div>

<script>
// Vamos usar apenas 8 imagens (pode variar ou atualizar)
const images = [
    "https://cdn.pixabay.com/animation/2025/06/02/00/11/00-11-22-330_512.gif",
    "https://cdn.pixabay.com/animation/2025/04/29/23/55/23-55-02-125_512.gif",
    "https://cdn.pixabay.com/animation/2024/07/30/00/20/00-20-15-644_512.gif",
    "https://cdn.pixabay.com/animation/2025/05/11/01/07/01-07-40-349_512.gif",
    "https://cdn.pixabay.com/animation/2023/05/04/16/12/16-12-04-538_512.gif",
    "https://cdn.pixabay.com/animation/2022/10/25/12/11/12-11-02-585_512.gif",
    "https://cdn.pixabay.com/animation/2024/01/19/00/53/00-53-56-818_512.gif",
    "https://cdn.pixabay.com/animation/2024/11/04/11/13/11-13-55-982_512.gif"
];

// Criar pares e embaralhar
let cards = [...images, ...images];
cards.sort(() => Math.random() - 0.5);

const game = document.getElementById("game");
let flipped = [];
let locked = false;

// Criar cartas
cards.forEach(src => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
        <div class="face front" style="background-image: url('${src}')"></div>
        <div class="face back">?</div>
    `;
    card.addEventListener("click", () => flipCard(card, src));
    game.appendChild(card);
});

function flipCard(card, src) {
    if (locked || card.classList.contains("flip")) return;
    card.classList.add("flip");
    flipped.push({ card, src });

    if (flipped.length === 2) {
        locked = true;
        setTimeout(() => {
            if (flipped[0].src === flipped[1].src) {
                flipped[0].card.classList.add("match");
                flipped[1].card.classList.add("match");
            } else {
                flipped[0].card.classList.remove("flip");
                flipped[1].card.classList.remove("flip");
            }
            flipped = [];
            locked = false;
        }, 800);
    }
}
</script>

</body>
</html>
